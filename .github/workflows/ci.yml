# Runs on every push and pull request to main:
#   server: install, run the Jest + Supertest suite with coverage (in-memory MongoDB, no secrets needed)
#   client: install and do a production build, so a broken import or JSX error fails CI
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push cancels an older run on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      # The in-memory MongoDB binary is ~140 MB; cache it between runs
      - uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}

      - run: npm ci
      - run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-coverage
          path: server/coverage
          retention-days: 14

  client:
    name: Client build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run build
