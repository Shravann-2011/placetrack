# Render's free tier puts the API to sleep after 15 minutes without traffic, and the
# first request after that takes ~30-50 s. This job pings the health check every
# 10 minutes so the API stays awake (one always-on service fits in Render's 750
# free hours a month). GitHub may delay scheduled runs by a few minutes, and it
# pauses schedules after 60 days without commits; the app's own retry covers both.
name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        run: |
          curl --silent --show-error --fail --max-time 90 --retry 3 --retry-delay 10 \
            https://placetrack-api-i0ko.onrender.com/api/health
